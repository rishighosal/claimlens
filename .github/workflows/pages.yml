name: demo-site

# Publishes the recorded demo (frontend/public/demo/, made by scripts/export_demo.py)
# to GitHub Pages. No server and no API keys: the UI replays a real recorded run.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - name: Check a recorded demo exists
        id: check
        run: |
          if [ -f frontend/public/demo/status.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::No recorded demo yet. Run scripts/export_demo.py and push frontend/public/demo."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site
        if: steps.check.outputs.ok == 'true'
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ok == 'true'
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
